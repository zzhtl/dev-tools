name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        working-directory: web
        run: bun install --frozen-lockfile
      - name: 类型检查
        working-directory: web
        run: bun run check
      - name: 单元测试
        working-directory: web
        run: bun test
      - name: 构建前端
        working-directory: web
        run: bun run build
      - name: 上传 dist 供后端作业复用
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    needs: frontend
    env:
      # 前端已由上一个作业构建，这里直接复用产物
      DEV_TOOLS_SKIP_WEB_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        run: cargo test --all
